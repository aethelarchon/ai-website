<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIHub - Future AI Tools</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
}

header{
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#38bdf8;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:15px;
}

.hero{
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:42px;
    margin-bottom:20px;
}

.hero p{
    color:#94a3b8;
    max-width:600px;
    margin:auto;
    line-height:1.6;
}

.tool-box{
    max-width:500px;
    margin:40px auto;
    background:#111827;
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.1);
}

.tool-box h2{
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:15px;
    margin-top:10px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#1e293b;
    color:white;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.result{
    margin-top:20px;
    color:#cbd5e1;
    line-height:1.6;
}

footer{
    text-align:center;
    padding:30px;
    color:#64748b;
}

</style>
</head>

<body>

<header>
    <div class="logo">AIHub</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Tools</a>
        <a href="#">Blog</a>
    </nav>
</header>

<section class="hero">

    <h1>Future AI Tools For Everyone</h1>

    <p>
        Generate smart AI captions instantly for Instagram, LinkedIn, YouTube and more.
    </p>

</section>

<div class="tool-box">

    <h2>AI Caption Generator</h2>

    <input type="text" id="topic" placeholder="Enter your topic...">

    <select id="tone">
        <option>Professional</option>
        <option>Funny</option>
        <option>Motivational</option>
        <option>Luxury</option>
    </select>

    <button onclick="generateCaption()">
        Generate Caption ✨
    </button>

    <div class="result" id="result"></div>

</div>

<footer>
    © 2026 AIHub. All rights reserved.
</footer>

<script>

function generateCaption(){

    let topic = document.getElementById("topic").value;

    let tone = document.getElementById("tone").value;

    let result = document.getElementById("result");

    if(topic == ""){
        result.innerHTML = "Please enter a topic.";
        return;
    }

    result.innerHTML =
    "✨ " + topic + " deserves attention. Stay " + tone + " and keep growing with AI.";
}

</script>

</body>
    </html>
